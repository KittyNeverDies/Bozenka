<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bozenka: Repository</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bozenka: Manage Your Community Across Platforms. Streamline management on Discord, Telegram, and VK.">  
    <meta name="keywords" content="Bozenka, community management, Discord, Telegram, VK, social media, automation, open source, analytics, community platform">
    <meta name="author" content="kittyneverdies">
  
    <meta property="og:title" content="Bozenka: Manage Your Community Across Platforms">
    <meta property="og:description" content="Streamline your community management on Discord, Telegram, and VK with Bozenka.">
    <meta property="og:image" content="https://kittyneverdies.is-a.dev/Bozenka/assets/logo.png">
    <meta property="og:url" content="https://kittyneverdies.is-a.dev/Bozenka/repository.html">
    <meta property="og:type" content="website">
      
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Bozenka: Manage Your Community Across Platforms">
    <meta name="twitter:description" content="Streamline your community management on Discord, Telegram, and VK with Bozenka.">
    <meta name="twitter:image" content="https://kittyneverdies.is-a.dev/Bozenka/assets/logo.png">
    
    <link href="https://cdn.jsdelivr.net/npm/beercss@3.5.6/dist/cdn/beer.min.css" rel="stylesheet" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@3.5.6/dist/cdn/beer.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@100;400;700&display=swap');
        * {
            font-family: "Montserrat", sans-serif;
            transition: all 0.2s ease;
        }

        .branch-selector {
            margin: 20px;
            padding: 10px;
        }

        .branch-selector .max {
            max-width: 300px;
            margin: 0 auto;
        }

        .field.border {
            position: relative;
            margin-bottom: 24px;
        }

        .field.border select {
            width: 100%;
            height: 56px;
            padding: 16px;
            border: 1px solid var(--outline);
            border-radius: 4px;
            background: var(--surface-container);
            color: var(--on-surface);
            font-size: 16px;
            transition: all 0.2s ease;
            appearance: none;
            cursor: pointer;
        }

        .field.border select:focus {
            border-color: var(--primary);
            outline: none;
        }

        .field.border select:focus + label {
            color: var(--primary);
            transform: translateY(-24px) scale(0.75);
            background: var(--surface);
            padding: 0 4px;
        }

        .field.border.label label {
            position: absolute;
            left: 16px;
            top: 16px;
            color: var(--on-surface-variant);
            pointer-events: none;
            transition: all 0.2s ease;
            transform-origin: left top;
            background: var(--surface);
            padding: 0 4px;
        }

        .field.border select:not(:placeholder-shown) + label {
            transform: translateY(-24px) scale(0.75);
        }

        .field.border::after {
            content: 'expand_more';
            font-family: 'Material Icons';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--on-surface-variant);
            pointer-events: none;
        }

        .field.border.error select {
            border-color: var(--error);
        }

        .field.border.error label {
            color: var(--error);
        }

        .field.border.error::after {
            color: var(--error);
        }

        .error-text {
            color: var(--error);
            font-size: 12px;
            margin-top: 4px;
            display: none;
            padding-left: 16px;
        }

        .field.border.error + .error-text {
            display: block;
        }

        .field.border.loading::after {
            content: '';
            border: 2px solid var(--outline);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: translateY(-50%) rotate(0deg); }
            100% { transform: translateY(-50%) rotate(360deg); }
        }

        .field.border.disabled select {
            background: var(--surface-variant);
            color: var(--on-surface-variant);
            cursor: not-allowed;
        }

        .field.border.disabled label {
            color: var(--on-surface-variant);
        }

        .field.border.success select {
            border-color: var(--tertiary);
        }

        .field.border.success label {
            color: var(--tertiary);
        }

        .commit-list {
            margin: 20px;
            padding: 20px;
            background: var(--surface-container);
            border-radius: 8px;
        }

        .commit-item {
            padding: 20px;
            margin: 10px 0;
            background: var(--surface-container-highest);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid var(--outline-variant);
            position: relative;
            overflow: hidden;
        }

        .commit-item:hover {
            transform: translateX(5px);
            border-color: var(--primary);
        }

        .commit-hash {
            color: var(--primary);
            font-family: monospace;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .commit-message {
            font-size: 1.1em;
            line-height: 1.4;
            padding: 4px 0;
        }

        .commit-author {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--on-surface-variant);
            background: var(--surface-container);
            padding: 8px 12px;
            border-radius: 16px;
            width: fit-content;
        }

        .commit-date {
            color: var(--on-surface-variant);
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .loading-animation {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            flex-direction: column;
            gap: 16px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--inverse-surface);
            color: var(--inverse-on-surface);
            padding: 12px 24px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 600px) {
            .commit-item {
                padding: 16px;
            }
        }
    </style>
</head>
<body class="scroll">
    <header class="fixed">
        <nav>
            <h5 class="max">
                <a href='index.html'>Bozenka Repository</a>
            </h5>
            <label class="switch icon">
                <input type="checkbox" id="theme-switch" onchange="toggleTheme()"/>
                <span>
                    <i id="theme-icon">light_mode</i>
                </span>
            </label>
        </nav>
    </header>

    <main style="margin-top: 80px">
        <div class="container">
            <div class="branch-selector">
                <div class="max">
                    <div class="field border" id="branch-field">
                        <select id="branch-select" onchange="loadCommits()">
                            <option value="" disabled selected>Choose a branch</option>
                        </select>
                    </div>
                    <div class="error-text" id="branch-error"></div>
                </div>
            </div>
            
            <div class="commit-list" id="commit-list">
                <div class="loading-animation">
                    <progress class="circle"></progress>
                    <span>Loading repository data...</span>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script>
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const icon = type === 'error' ? 'error' : 'info';
            toast.innerHTML = `<i>${icon}</i><span>${message}</span>`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function toggleTheme() {
            let newMode = document.getElementById("theme-switch").checked ? "dark" : "light";
            ui("mode", newMode);
            let themeIcon = document.getElementById("theme-icon");
            themeIcon.textContent = newMode === "dark" ? "dark_mode" : "light_mode";
        }

        async function initTheme() {
            let is_dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.getElementById('theme-switch').checked = is_dark;
            document.getElementById("theme-icon").textContent = is_dark ? "dark_mode" : "light_mode";
            ui("mode", is_dark ? "dark" : 'light');
        }

        function setBranchFieldState(state, message = '') {
            const field = document.getElementById('branch-field');
            const error = document.getElementById('branch-error');
            
            field.classList.remove('error', 'loading', 'disabled', 'success');
            
            if (state) {
                field.classList.add(state);
            }
            
            error.textContent = message;
        }

        async function loadBranches() {
            const branchSelect = document.getElementById('branch-select');
            
            setBranchFieldState('loading');
            branchSelect.disabled = true;
            
            try {
                const response = await fetch('https://api.github.com/repos/kittyneverdies/Bozenka/branches');
                if (!response.ok) {
                    throw new Error(`Failed to fetch branches: ${response.statusText}`);
                }
                
                const branches = await response.json();
                
                if (branches.length === 0) {
                    throw new Error('No branches available in this repository');
                }
                
                branchSelect.innerHTML = `
                    <option value="" disabled selected>Choose a branch</option>
                    ${branches.map(branch => `
                        <option value="${branch.name}">${branch.name}</option>
                    `).join('')}
                `;
                
                setBranchFieldState('success');
                branchSelect.disabled = false;
                
                loadCommits();
            } catch (error) {
                console.error('Error loading branches:', error);
                branchSelect.innerHTML = '<option value="" disabled selected>Error loading branches</option>';
                setBranchFieldState('error', error.message);
                branchSelect.disabled = true;
                showToast(error.message, 'error');
            }
        }

        async function loadCommits() {
            const branch = document.getElementById('branch-select').value;
            const commitList = document.getElementById('commit-list');
            
            if (!branch) {
                commitList.innerHTML = `
                    <div class="loading-animation">
                        <i class="large">emoticon</i>
                        <p>Select a branch to view commits</p>
                    </div>
                `;
                return;
            }
            
            commitList.innerHTML = `
                <div class="loading-animation">
                    <progress class="circle"></progress>
                    <span>Loading commits for ${branch}...</span>
                </div>
            `;
            
            try {
                const response = await fetch(`https://api.github.com/repos/kittyneverdies/Bozenka/commits?sha=${branch}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch commits');
                }
                
                const commits = await response.json();
                
                if (commits.length === 0) {
                    commitList.innerHTML = `
                        <div class="loading-animation">
                            <i>source_fork</i>
                            <p>No commits found in this branch</p>
                        </div>
                    `;
                    return;
                }
                
                commitList.innerHTML = commits.map(commit => `
                    <div class="commit-item" onclick="copyCommitHash('${commit.sha}')">
                        <div class="commit-hash">
                            <i>commit</i>
                            ${commit.sha.substring(0, 7)}
                        </div>
                        <div class="commit-message">${commit.commit.message}</div>
                        <div class="commit-author">
                            <i>person</i>
                            ${commit.commit.author.name}
                        </div>
                        <div class="commit-date">
                            <i>schedule</i>
                            ${new Date(commit.commit.author.date).toLocaleString()}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading commits:', error);
                commitList.innerHTML = `
                    <div class="error-message">
                        <i>error</i>
                        <p>${error.message}</p>
                        <button class="retry-button" onclick="loadCommits()">
                            <i>refresh</i>
                            <span>Retry</span>
                        </button>
                    </div>
                `;
                showToast(error.message, 'error');
            }
        }

        async function copyCommitHash(hash) {
            try {
                await navigator.clipboard.writeText(hash);
                showToast('Commit hash copied to clipboard');
            } catch (err) {
                showToast('Failed to copy commit hash', 'error');
            }
        }

        window.onload = async () => {
            try {
                await initTheme();
                await loadBranches();
            } catch (error) {
                console.error('Error initializing page:', error);
                showToast('Failed to initialize the page', 'error');
            }
        };
    </script>
</body>
</html>
